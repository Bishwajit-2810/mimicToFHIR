services:

  db:
    image: postgres:16
    container_name: mimic_pg
    environment:
      POSTGRES_USER:     mimic
      POSTGRES_PASSWORD: mimic
      POSTGRES_DB:       mimiciv
    ports:
      - "5433:5432"
    volumes:
      - mimic_pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mimic -d mimiciv"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mimic_pgdata:
